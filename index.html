<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Ashley &amp; Eric · October 2, 2027 · Deià, Mallorca"><link rel="icon" href="img/favicon.png"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<title>Ashley &amp; Eric</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&amp;family=Monsieur+La+Doulaise&amp;family=Special+Elite&amp;family=Lora:wght@400;500&amp;family=Mrs+Saint+Delafield&amp;family=Great+Vibes&amp;family=Parisienne&amp;family=Italiana&amp;family=Bodoni+Moda:ital,wght@1,400;1,500&amp;family=Cinzel:wght@400;500&amp;family=Inter:wght@300;400&amp;family=Montserrat:wght@300;400;600&amp;family=Lato:wght@300;400&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Cormorant+SC:wght@400;500&amp;family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;display=swap">
<style id="css">
/* Layout: one long scroll — envelope intro, full-bleed countryside hero, then alternating ivory and chocolate bands, each opened by a script word laid over spaced capitals. */
:root{
  --espresso:#2a211b; --cocoa:#3d3027; --ivory:#f3eee5; --linen:#e7dfd1;
  --gold:#b69968; --gold-soft:#d2bf97; --ink:#3a2f28; --muted:#7c6d60; --rule:#cdbfa9;
  --f-script:"Pinyon Script","Great Vibes",cursive;
  --f-display:"Italiana","Cormorant SC",Georgia,serif;
  --f-body:"EB Garamond",Garamond,Georgia,serif;
  --gut:max(20px, env(safe-area-inset-left, 0px));
  --gutr:max(20px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
html{scroll-behavior:smooth;scroll-padding-top:72px}
html.locked{overflow:hidden}
body{background:var(--ivory);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--espresso)}
a{color:inherit;text-decoration-color:var(--gold);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
.narrow{max-width:720px}
.band{padding-block:clamp(72px,10vw,128px)}
.dark{background:var(--cocoa);color:var(--ivory)}
.dark a{text-decoration-color:var(--gold-soft)}
.linen{background:var(--linen)}
.label{font-family:var(--f-body);font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.dark .label{color:var(--gold-soft)}
em,.ital{font-style:italic}

/* Section heading: script over capitals */
.sh{display:grid;justify-items:center;text-align:center;margin:0 0 clamp(40px,6vw,64px);font-weight:400}
.sh-script{font-family:var(--f-script);font-size:clamp(58px,9vw,108px);line-height:.8;color:var(--gold);position:relative;z-index:1;transform:translateY(.28em) rotate(-4deg);margin-left:-1.4em}
.sh-caps{font-family:var(--f-display);font-size:clamp(32px,5.4vw,60px);letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;line-height:1.1;color:var(--ink)}
.dark .sh-script{color:var(--gold-soft)}
.dark .sh-caps{color:var(--ivory)}
.flourish{display:block;width:min(360px,70%);height:22px;margin:0 auto;color:var(--gold)}
.dark .flourish{color:var(--gold-soft)}

/* Navigation */
.nav{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:50;transition:background .4s,box-shadow .4s}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;max-width:1240px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
.nav.solid{background:rgba(42,33,27,.96);box-shadow:0 1px 0 rgba(210,191,151,.25)}
.mono{color:var(--ivory);text-decoration:none;display:block;width:78px}
.mono:hover{color:var(--gold-soft)}
.ft-mono{width:120px;margin:0 auto 6px;color:var(--gold-soft)}
.nav ul{list-style:none;display:flex;gap:clamp(14px,2vw,30px);margin:0;padding:0;align-items:center}
.nav ul a{color:var(--ivory);text-decoration:none;font-size:13px;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
.nav ul a:hover{color:var(--gold-soft)}
.nav ul a.pill{border:1px solid var(--gold-soft);padding:8px 16px 7px 18px}
.menu-btn{display:none;background:none;border:0;color:var(--ivory);font:inherit;font-size:13px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;padding:10px 0}
@media (max-width:1000px){
  .menu-btn{display:block}
  .nav ul{position:fixed;inset:0;top:0;background:var(--espresso);flex-direction:column;justify-content:center;gap:26px;padding:80px var(--gutr) 40px var(--gut);transform:translateY(-100%);transition:transform .45s ease;z-index:-1}
  .nav.open ul{transform:none}
  .nav ul a{font-size:15px}
}

/* Painted landscape / photo slots */
.photo{position:relative;margin:0;overflow:hidden;background:#4a4637}
.photo canvas,.photo img,.photo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photo-btn{display:none}

/* Hero */
.hero{position:relative;min-height:min(94vh,900px);display:grid;place-items:center;text-align:center;color:var(--ivory);overflow:hidden}
.hero>.photo{position:absolute;inset:0}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(30,24,18,.15),rgba(30,24,18,.55) 75%),linear-gradient(rgba(30,24,18,.45),transparent 30%,transparent 70%,rgba(30,24,18,.5))}
.hero-in{position:relative;z-index:2;padding:120px var(--gutr) 80px var(--gut);display:grid;gap:18px;justify-items:center}
.hero-kicker{font-size:14px;letter-spacing:.34em;text-transform:uppercase;line-height:2}
.hero-names{font-family:var(--f-script);font-size:clamp(68px,13vw,168px);line-height:1;font-weight:400;margin:0;text-shadow:0 2px 30px rgba(0,0,0,.25)}
.hero-date{font-family:var(--f-display);font-size:clamp(20px,2.6vw,28px);letter-spacing:.32em;text-transform:uppercase;padding-left:.32em}
.hero-place{font-size:15px;letter-spacing:.3em;text-transform:uppercase;opacity:.9}
.btn{display:inline-block;font-family:var(--f-body);font-size:13px;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;padding:14px 30px 13px 34px;border:1px solid currentColor;color:inherit;background:transparent;cursor:pointer;transition:background .3s,color .3s}
.btn:hover{background:var(--ivory);color:var(--espresso)}
.btn.solid{background:var(--cocoa);color:var(--ivory);border-color:var(--cocoa)}
.btn.solid:hover{background:var(--espresso)}
.dark .btn.solid{background:var(--ivory);color:var(--espresso);border-color:var(--ivory)}
.hero .btn{margin-top:14px}

/* Countdown */
.count{background:var(--espresso);color:var(--ivory);padding-block:34px;text-align:center}
.count-row{display:flex;justify-content:center;gap:clamp(18px,5vw,64px);flex-wrap:wrap}
.count-cell{display:grid;gap:2px;min-width:70px}
.count-num{font-family:var(--f-display);font-size:clamp(34px,5vw,52px);line-height:1;font-variant-numeric:tabular-nums}
.count .label{font-size:11px}
.count-cap{font-family:var(--f-script);font-size:30px;color:var(--gold-soft);margin-bottom:10px;display:block}

/* Story */
.story{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(36px,6vw,88px);align-items:center}
.story-col{display:grid;gap:24px;min-width:0}
.story-text{display:grid;gap:20px;min-width:0}
.story-text p:first-of-type::first-letter{font-family:var(--f-display);float:left;font-size:4.1em;line-height:.8;padding:6px 10px 0 0;color:var(--gold)}
.sign{font-family:var(--f-script);font-size:40px;color:var(--gold);line-height:1.1}
.arch{aspect-ratio:3/4;border-radius:999px 999px 0 0;max-width:100%}
.arch-frame{padding:12px;border:1px solid var(--rule);border-radius:999px 999px 0 0}
@media (max-width:820px){.story{grid-template-columns:1fr}.arch-frame{max-width:380px;margin:0 auto;width:100%}}

/* Weekend */
.timeline{max-width:860px;margin:0 auto clamp(56px,8vw,96px);border-top:1px dotted var(--gold-soft)}
.tl{display:grid;grid-template-columns:1.1fr 1.4fr 1fr;gap:16px;padding:20px 0;border-bottom:1px dotted var(--gold-soft);align-items:baseline}
.tl-when{font-variant-numeric:tabular-nums;color:var(--gold-soft);font-size:16px;letter-spacing:.06em}
.tl-name{font-family:var(--f-display);font-size:clamp(22px,2.6vw,30px);letter-spacing:.12em;text-transform:uppercase}
.tl-where{text-align:right;font-style:italic;color:#d9cfbf}
@media (max-width:640px){.tl{grid-template-columns:1fr;gap:2px}.tl-where{text-align:left}}
.events{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(24px,3vw,40px)}
@media (max-width:900px){.events{grid-template-columns:1fr;max-width:520px;margin:0 auto}}
.event{display:grid;gap:18px;align-content:start;text-align:center}
.event .photo{aspect-ratio:4/5;border-radius:999px 999px 0 0}
.event-title{font-family:var(--f-script);font-size:48px;line-height:1;color:var(--gold-soft);font-weight:400;margin:0}
.event dl{margin:0;display:grid;gap:14px}
.event dt{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-soft)}
.event dd{margin:2px 0 0;font-size:17px;line-height:1.5}
.event .tba{font-family:var(--f-display);font-size:26px;letter-spacing:.3em;padding-left:.3em}
.wk-note{text-align:center;margin-top:clamp(48px,6vw,72px);font-style:italic;color:#d9cfbf}

/* Interlude */
.interlude{position:relative;height:clamp(320px,48vw,520px);display:grid;place-items:center;text-align:center;color:var(--ivory);overflow:hidden}
.interlude>.photo{position:absolute;inset:0}
.interlude::after{content:"";position:absolute;inset:0;background:rgba(30,24,18,.35)}
.interlude-in{position:relative;z-index:2;display:grid;gap:8px;padding-left:var(--gut);padding-right:var(--gutr)}
.interlude-word{font-family:var(--f-script);font-size:clamp(80px,14vw,170px);line-height:1}
.interlude-line{font-size:14px;letter-spacing:.3em;text-transform:uppercase;max-width:34ch;margin:0 auto;line-height:2}

/* Info grids */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(32px,5vw,64px) clamp(32px,6vw,88px)}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.item{display:grid;gap:10px;min-width:0}
.item h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.16em;text-transform:uppercase}
.item h3::after{content:"";display:block;width:36px;height:1px;background:var(--gold);margin-top:12px}
.lede{font-family:var(--f-body);font-style:italic;font-size:clamp(22px,2.6vw,28px);line-height:1.45;text-align:center;max-width:36ch;margin:0 auto clamp(40px,5vw,60px);color:var(--muted)}
.dark .lede{color:var(--gold-soft)}

/* Hotels */
.hotels{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(24px,4vw,48px);margin-bottom:clamp(40px,5vw,64px)}
@media (max-width:700px){.hotels{grid-template-columns:1fr}}
.hotel{background:var(--ivory);padding:14px 14px 30px;display:grid;gap:12px;text-align:center}
.hotel .photo{aspect-ratio:3/2}
.hotel-name{font-family:var(--f-display);font-size:28px;letter-spacing:.1em;margin:6px 0 0;font-weight:400}
.hotel-town{font-style:italic;color:var(--muted)}
.notes{max-width:720px;margin:0 auto;display:grid;gap:18px;text-align:center}

/* Directory */
.dir{margin-top:clamp(56px,7vw,88px);border-top:1px solid var(--rule);padding-top:clamp(36px,5vw,56px)}
.dir-h{text-align:center;font-family:var(--f-script);font-size:42px;color:var(--gold);margin:0 0 28px;font-weight:400;line-height:1.2}
.dir-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;text-align:center}
@media (max-width:760px){.dir-cols{grid-template-columns:1fr}}
.dir-cols h4{margin:0 0 10px;font-weight:400;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.dir-cols div{line-height:1.9}

/* Towns */
.towns{max-width:900px;margin:0 auto;border-top:1px solid rgba(210,191,151,.35)}
.town{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px 40px;padding:30px 0;border-bottom:1px solid rgba(210,191,151,.35)}
.town-name{font-family:var(--f-display);font-size:clamp(28px,3.4vw,38px);letter-spacing:.1em;margin:0;font-weight:400;line-height:1.1}
.town-dist{display:block;font-family:var(--f-body);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft);margin-top:8px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.town{grid-template-columns:1fr}}

/* FAQ */
.faq{display:grid;grid-template-columns:repeat(2,1fr);gap:40px 72px}
@media (max-width:760px){.faq{grid-template-columns:1fr}}
.qa{display:grid;gap:8px;min-width:0;align-content:start}
.qa h3{margin:0;font-family:var(--f-body);font-weight:500;font-size:20px;line-height:1.35}

/* Registry */
.registry{text-align:center;display:grid;gap:22px;justify-items:center}
.registry .big{font-family:var(--f-display);font-size:clamp(30px,4.4vw,48px);line-height:1.2;max-width:22ch}

/* RSVP */
.rsvp-head{text-align:center;display:grid;gap:8px;margin-bottom:40px}
.rsvp-head .big{font-family:var(--f-display);font-size:clamp(26px,3.4vw,36px);letter-spacing:.08em}
form{display:grid;gap:26px;max-width:640px;margin:0 auto}
.field{display:grid;gap:8px}
.field label,.field legend{font-size:17px;padding:0}
.hint{font-size:15px;font-style:italic;color:#cbbfae}
input[type=text],input[type=email],textarea{font:inherit;font-size:18px;color:var(--ivory);background:rgba(243,238,229,.06);border:0;border-bottom:1px solid var(--gold-soft);padding:10px 4px;width:100%;box-sizing:border-box;border-radius:0}
textarea{min-height:90px;resize:vertical}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px}
.choices{display:flex;gap:28px;flex-wrap:wrap}
.choices label{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:17px}
input[type=radio]{accent-color:var(--gold-soft);width:18px;height:18px}
.form-msg{text-align:center;font-style:italic;color:var(--gold-soft);min-height:1.6em}

/* Footer */
footer{background:var(--espresso);color:var(--ivory);text-align:center;padding-block:56px calc(56px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
footer .fn{font-family:var(--f-script);font-size:56px;color:var(--gold-soft);line-height:1}
footer .label{color:#bfb19c}

/* Envelope intro (vellum envelope over a slowly zooming photo) */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:#2f2f24;transition:opacity 1.1s ease}
.intro>.photo{position:absolute;inset:0;background:#2f2f24}
.intro>.photo canvas,.intro>.photo img,.intro>.photo video{animation:drift 34s ease-in-out infinite alternate;transform-origin:50% 40%;will-change:transform}
@keyframes drift{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.2) translate3d(-1.5%,1%,0)}}
.intro::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(20,16,12,.38),rgba(20,16,12,.18) 40%,rgba(20,16,12,.5))}
.env-stage{position:relative;z-index:2;display:grid;justify-items:center;gap:clamp(14px,2.6vh,26px);padding-left:var(--gut);padding-right:var(--gutr);perspective:1600px}
.env-top,.env-bottom{font-family:"Bodoni Moda",var(--f-display),serif;font-style:italic;color:#fbf8f2;text-align:center;text-shadow:0 1px 14px rgba(0,0,0,.45);line-height:1.2}
.env-top{font-size:clamp(22px,3.2vw,32px)}
.env-bottom{font-size:clamp(20px,2.8vw,28px);cursor:pointer;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{opacity:.65}}
.env{position:relative;width:min(600px,88vw);aspect-ratio:1.52;cursor:pointer;container-type:inline-size;outline-offset:8px}
.env>*{position:absolute;inset:0;width:100%;height:100%}
.env-inside{z-index:0}.env-card{z-index:2}.env-pocket{z-index:3}.env-flap{z-index:4}.env-words{z-index:5}.env-seal{z-index:6}
.env-inside{background:rgba(250,249,245,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);box-shadow:0 26px 50px rgba(10,8,5,.35);border-radius:2px}
.env-card{left:4%;right:4%;top:4%;width:auto;height:90%;background:var(--ivory);display:grid;align-content:center;justify-items:center;gap:1.2cqw;text-align:center;color:var(--ink);opacity:0;box-shadow:0 0 0 1px #dccfb9 inset,0 4px 18px rgba(0,0,0,.18);transition:transform 1.1s cubic-bezier(.2,.7,.2,1),opacity .3s}
.env-card::before{content:"";position:absolute;inset:1.6cqw;border:1px solid var(--rule)}
.env-card .mono-svg{width:18cqw;color:var(--gold)}
.env-card-k{font-size:max(9px,1.6cqw);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.env-card-n{font-family:var(--f-script);font-size:9cqw;line-height:1.05;color:var(--cocoa)}
.env-card-d{font-family:var(--f-display);font-size:3cqw;letter-spacing:.3em;padding-left:.3em}
.env-card-p{font-style:italic;color:var(--muted);font-size:2.6cqw}
.env-pocket{background:linear-gradient(170deg,rgba(255,255,253,.7),rgba(246,245,240,.8));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);clip-path:polygon(0 0,50% 49%,100% 0,100% 100%,0 100%);border-radius:2px}

.env-doily{z-index:5;pointer-events:none;opacity:.34;transition:opacity .45s ease}
.intro.opening .env-doily{opacity:0}
.env-words .w2{position:absolute;left:8%;right:8%;top:6.5%;text-align:center;font-family:"Pinyon Script",cursive;font-size:9.4cqw;line-height:1}
.env-words .w4{position:absolute;left:0;right:0;top:63%;text-align:center;font-family:"Bodoni Moda",var(--f-display),serif;font-style:italic;font-weight:400;font-size:5.6cqw;letter-spacing:.01em}
.env-words .w5{position:absolute;left:0;right:0;top:75%;text-align:center;font-family:"Pinyon Script",cursive;font-size:4.7cqw}
.env-seal{left:42.5%;top:37.5%;right:auto;bottom:auto;width:15%;height:auto;filter:drop-shadow(0 4px 5px rgba(40,28,10,.35)) drop-shadow(0 1px 1px rgba(40,28,10,.4));transition:transform .5s ease,opacity .5s ease}
.env-seal img{width:100%;height:auto;display:block;user-select:none}
.env:hover .env-seal,.env:focus-visible .env-seal{transform:scale(1.04)}
.intro.opening .env-seal{transform:scale(.7) translateY(-10%);opacity:0}
.intro.opening .env-words,.intro.opening .env-bottom,.intro.opening .env-top{opacity:0;animation:none;transition:opacity .45s}
.intro.opening .env-card{opacity:1}
.intro.opening .env-flap{transform:perspective(1600px) rotateX(180deg)}
.intro.flapped .env-flap{z-index:1}
.intro.rising .env-card{transform:translateY(-48%) scale(1.03)}
.intro.gone{opacity:0;pointer-events:none}
body.editing .env-words{pointer-events:auto}
.mono-svg{display:block;fill:currentColor;height:auto}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}html{scroll-behavior:auto}}

/* Editing */
.edit-fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--espresso);color:var(--ivory);border:1px solid var(--gold-soft);font:inherit;font-size:13px;letter-spacing:.2em;text-transform:uppercase;padding:12px 20px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.edit-bar{position:fixed;left:0;right:0;bottom:0;z-index:95;background:#1f1914;color:var(--ivory);padding:12px var(--gutr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut);display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;font-family:system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.3;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.edit-bar .grp{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.edit-bar select,.edit-bar button,.linkbar input,.linkbar button,.fmtbar button{font:inherit;font-size:13px;padding:7px 12px;border-radius:4px;border:1px solid #6a5b4c;background:#2e2620;color:var(--ivory);cursor:pointer}
.edit-bar button.primary{background:var(--gold);border-color:var(--gold);color:#1f1914;font-weight:600}
.edit-bar button:disabled{opacity:.5;cursor:default}
.edit-bar .status{color:#cbbfae}
body.editing{padding-bottom:110px}
body.editing [data-k]{outline:1px dashed rgba(182,153,104,.55);outline-offset:3px;cursor:text;border-radius:2px}
body.editing [data-k]:hover,body.editing [data-k]:focus{outline:2px solid var(--gold);background:rgba(182,153,104,.08)}
body.editing .photo-btn{display:block;position:absolute;z-index:5;left:50%;bottom:16px;transform:translateX(-50%);font:600 13px system-ui,sans-serif;padding:8px 14px;border-radius:4px;border:0;background:rgba(31,25,20,.85);color:#fff;cursor:pointer;white-space:nowrap}
.hero .photo-btn,.interlude .photo-btn,.intro .photo-btn{bottom:auto;top:84px}
.fmtbar,.linkbar{position:absolute;z-index:120;display:flex;gap:6px;background:#1f1914;padding:6px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.3);font-family:system-ui,sans-serif}
.photo.drop-target::before{content:"Drop to use this photo";position:absolute;inset:8px;z-index:6;display:grid;place-items:center;border:2px dashed #fff;background:rgba(74,52,46,.55);color:#fff;font:600 15px system-ui,sans-serif;letter-spacing:.02em;pointer-events:none}
.photo.slot-selected::after{content:"Selected: paste a photo";position:absolute;inset:6px;z-index:6;border:2px solid #fff;outline:2px solid #4a342e;display:grid;place-items:end center;padding-bottom:14px;color:#fff;font:600 13px system-ui,sans-serif;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
body.editing .photo{cursor:pointer}
.photo.uploading::before{content:"Uploading…";position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(255,255,255,.6);color:#4a342e;font:600 15px system-ui,sans-serif;pointer-events:none}
.hero .photo.drop-target::before,.interlude .photo.drop-target::before,.intro .photo.drop-target::before{z-index:3}
/* Weekend timeline: center line, alternating entries */
.tline{position:relative;max-width:920px;margin:0 auto}
.tline::before{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:1px;background:#d8cbb9}
.tli{display:grid;grid-template-columns:1fr 1fr;column-gap:84px;position:relative;padding-block:26px 40px}
.tli::before{content:"";position:absolute;left:50%;top:34px;width:15px;height:15px;border-radius:50%;background:#d8cbb9;transform:translateX(-50%)}
.tli-left .tli-body{grid-column:1;text-align:right}
.tli-right .tli-body{grid-column:2;text-align:left}
.tli-head{display:flex;align-items:center;gap:22px;margin-bottom:12px}
.tli-left .tli-head{justify-content:flex-end}
.tli-right .tli-head{flex-direction:row-reverse;justify-content:flex-end}
.tli-icon{width:64px;flex:none;color:var(--ink2);opacity:.8}
.tli-icon svg{display:block;width:100%;height:auto}
.tli-when{font-family:"Montserrat",var(--f-body);font-weight:400;font-size:15px;letter-spacing:.08em;color:#8a7a6c}
.tli-name{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3vw,34px);letter-spacing:.03em;text-transform:uppercase;color:var(--ink2);line-height:1.15}
.tli-where{font-size:17px;line-height:1.6;color:var(--grey)}
.tli-dress{margin-top:10px;font-family:var(--f-serif);font-style:italic;font-size:19px;color:var(--ink2)}
.wk-tr{position:relative;max-width:560px;margin:0 auto;padding-top:36px;display:grid;justify-items:center;gap:16px;text-align:center}
.wk-tr::before{content:"";position:absolute;left:50%;top:-8px;height:44px;width:1px;background:#d8cbb9}
.wk-tr-ic{width:72px;height:72px;border:1px solid #d8cbb9;border-radius:50%;display:grid;place-items:center;color:var(--ink2);background:var(--white,#fff)}
.wk-tr-ic svg{display:block;width:40px;height:auto;opacity:.85}
.wk-tr-t{font-family:var(--f-serif);font-style:italic;font-size:21px;line-height:1.5;color:var(--ink2);max-width:40ch}
@media (max-width:720px){.wk-tr::before{display:none}.wk-tr{padding-top:44px}}
.tli-dress [data-k="ev1-l3"],.tli-dress [data-k="ev2-l3"]{font-style:normal;font-family:"Montserrat",var(--f-body);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8a7a6c}
@media (max-width:720px){
  .tline::before{left:7px}
  .tli{grid-template-columns:1fr;padding-left:40px}
  .tli::before{left:7px}
  .tli-left .tli-body,.tli-right .tli-body{grid-column:1;text-align:left}
  .tli-left .tli-head,.tli-right .tli-head{flex-direction:row-reverse;justify-content:flex-end}
  .tli-icon{width:48px}
}
/* Travel & Stay: photo backdrop with an ivory box */
.boxed{position:relative;padding-block:clamp(72px,10vw,140px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.boxed>.photo{position:absolute;inset:0}
.boxed>.photo canvas{filter:grayscale(1) brightness(1.75) contrast(.62)}
.boxed>.photo img,.boxed>.photo video{filter:grayscale(1) brightness(1.05) contrast(.9)}
.box{position:relative;z-index:1;max-width:1060px;margin:0 auto;background:#fbfaf7;padding:clamp(40px,6vw,80px) clamp(22px,6vw,90px);text-align:center;box-shadow:0 10px 40px rgba(30,25,20,.12)}
.box-h{margin:0 0 18px;font-family:var(--f-display);font-weight:400;font-size:clamp(34px,5vw,58px);color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;line-height:1.1}
.box-lede{max-width:56ch;margin:0 auto clamp(36px,5vw,56px);font-size:19px;color:var(--grey)}
.box-sub{margin:0 0 clamp(28px,4vw,44px);font-family:var(--f-display);font-weight:400;font-size:clamp(24px,2.8vw,32px);color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.box-grid{text-align:center;gap:clamp(32px,4vw,48px) clamp(28px,5vw,64px)}
.box .item h3{font-family:"Montserrat",var(--f-body);font-weight:600;font-size:15px;letter-spacing:.22em;color:var(--ink2)}
.box .item h3::after{display:none}
.box .item p{font-size:17px}
.box-rule{height:1px;background:var(--hair);margin:clamp(48px,6vw,72px) auto;max-width:520px;scroll-margin-top:96px}
.box .hotel{background:#fff}
.box .notes{margin-top:8px}
/* ===== Section separation: every band gets its own ground ===== */
.band+.band{border-top:0}
.count{background:var(--ink2);color:#f3ebe0;border:0}
.count-cap{color:#f8f4ee}.count-num{color:#f8f4ee}.count .label{color:#d7c8b5}
#story{background:#fff}
#weekend{background:var(--ivory2)}
#transport{background:#fff}
#explore{background:#efe6d8}
#faq{background:#fff}
#registry{background:var(--ivory2)}
#rsvp{background:var(--ink2);color:#e9dfd2}
#rsvp .sh-script,#rsvp .sh-caps,#rsvp .rsvp-head .big,#rsvp .field label,#rsvp .field legend{color:#f8f4ee}
#rsvp .label,#rsvp .hint,#rsvp .choices label{color:#d7c8b5}
#rsvp input[type=text],#rsvp input[type=email],#rsvp textarea{background:rgba(255,255,255,.05);color:#f8f4ee;border-bottom-color:rgba(248,244,238,.45)}
#rsvp input[type=radio]{accent-color:#f8f4ee}
#rsvp .btn.solid{color:#f8f4ee;border-color:#f8f4ee}
#rsvp .btn.solid:hover{background:#f8f4ee;color:var(--ink2)}
#rsvp .form-msg{color:#f8f4ee}
#rsvp .flourish{color:#c2a06a}
footer{background:#fff;border-top:0}
/* ===== Explore map ===== */
.explore-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:start}
.map-col{position:sticky;top:92px}
@media (max-width:900px){.explore-grid{grid-template-columns:1fr}.map-col{position:static}}
.map{position:relative;aspect-ratio:900/735;background:#dfe4e1;overflow:hidden;box-shadow:0 0 0 1px #d8cdbd;max-width:100%}
.map-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-land{fill:#fbf8f2}
.map-land-line{fill:none;stroke:#b9a891;stroke-width:1.2;vector-effect:non-scaling-stroke}
.map-sea{font-family:var(--f-serif);font-style:italic;font-size:22px;fill:#8d9a96;letter-spacing:.04em}
.map.is-wedding .map-sea{display:none}
.map-pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;background:none;border:0;padding:4px;cursor:pointer;pointer-events:auto;font:inherit;color:var(--ink2)}
.pin .dot{width:11px;height:11px;border-radius:50%;background:var(--ink2);box-shadow:0 0 0 3px rgba(255,255,255,.9);flex:none}
.pin .lab{font-family:"Montserrat",var(--f-body);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 4px #fbf8f2,0 0 4px #fbf8f2,0 0 6px #fbf8f2}
.pin.lab-l{flex-direction:row-reverse;transform:translate(calc(-100% + 9px),-50%)}
.pin.lab-r{transform:translate(-9px,-50%)}
.pin.lab-t{flex-direction:column-reverse;gap:3px;transform:translate(-50%,calc(-100% + 9px))}
.pin:hover .dot,.pin:focus-visible .dot{transform:scale(1.25)}
.pin-hotel .dot{border-radius:2px;background:#8a6a3c}
.pin-venue .dot{width:16px;height:16px;background:#c2a06a;box-shadow:0 0 0 3px #fff,0 0 0 4px #c2a06a}
.pin-air .dot{background:#fff;box-shadow:0 0 0 2px var(--ink2)}
.pin-zoom .dot{width:26px;height:26px;background:transparent;box-shadow:0 0 0 2px #c2a06a;animation:pulse 2.4s ease-in-out infinite}
.pin-zoom .lab{color:#8a6a3c}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(194,160,106,.25)}}
.map:not(.is-wedding) .in-cluster{display:none}
.map.is-wedding .island-only{display:none}
.map.is-wedding .pin[data-id="palma"],.map.is-wedding .pin[data-id="pmi"]{display:none}
.map-card{position:absolute;z-index:3;width:min(260px,80%);background:#fff;box-shadow:0 10px 30px rgba(40,30,20,.18);padding:16px 18px 14px;text-align:left}
.map-x{position:absolute;right:6px;top:2px;background:none;border:0;font-size:22px;line-height:1;color:#8a7a6c;cursor:pointer;padding:4px}
.mc-name{font-family:var(--f-display);font-size:20px;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase;padding-right:16px}
.mc-sub{font-size:14px;color:var(--grey);margin-top:4px;line-height:1.45}
.mc-links{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:14px}
.mc-links a{color:var(--ink2)}
.map-ctl{display:flex;gap:10px;margin-top:14px}
.map-btn{font-family:"Montserrat",var(--f-body);font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--ink2);background:transparent;color:var(--ink2);cursor:pointer}
.map-btn.is-on{background:var(--ink2);color:#fff}
.map-key{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--grey)}
.map-key .k{display:inline-block;width:10px;height:10px;margin-right:-8px;background:var(--ink2);border-radius:50%}
.map-key .k-hotel{border-radius:2px;background:#8a6a3c}.map-key .k-venue{background:#c2a06a}
#explore .town{border-color:#d8cbb6!important}
#explore .towns{border-color:#d8cbb6!important}
#explore .town{grid-template-columns:1fr;gap:6px;padding:22px 0;scroll-margin-top:96px}
#explore .town:target{background:rgba(255,255,255,.5)}
/* Invitation card insert: photo of the couple beside the names */
.env-card{display:grid;grid-template-columns:1.05fr 1fr;align-content:stretch;align-items:stretch;gap:3cqw;padding:3.4cqw}
.card-photo{position:relative;min-height:0;background:#d9d4cc;box-shadow:0 0 0 1px #e4dccd}
.card-photo canvas,.card-photo img,.card-photo video{filter:grayscale(1) contrast(1.02)}
.card-txt{position:relative;display:grid;align-content:center;justify-items:center;gap:1.1cqw;text-align:center;min-width:0}
.card-txt .mono-svg{width:15cqw;color:var(--candle,#c2a06a)}
.env-card .env-card-n{font-size:7cqw;color:var(--ink2,#4a342e)}
.env-card .env-card-d{font-size:2.6cqw;color:var(--ink2,#4a342e)}
.intro.peek .env-flap{transform:perspective(1600px) rotateX(180deg);z-index:1}
.intro.peek .env-card{opacity:1;transform:translateY(-48%) scale(1.03)}
.intro.peek .env-seal,.intro.peek .env-words{opacity:0;pointer-events:none}
body.editing .card-photo .photo-btn{top:auto;bottom:8px;font-size:11px;padding:6px 10px}
.linkbar input{width:min(280px,60vw);cursor:text;background:#fff;color:#111}
/* ===== Ivory & ink restyle: white page, Cinzel capitals, light sans body ===== */
:root{--white:#ffffff;--ink2:#4a342e;--grey:#6e635b;--hair:#e6ddd0;--cream:#fbf3e3;--ivory2:#f8f4ee;--candle:#c2a06a;
  --f-display:"Cinzel",Georgia,serif;--f-body:"Inter","Helvetica Neue",Arial,sans-serif;--f-serif:"Cormorant Garamond",Georgia,serif;--f-button:"Italiana","Cormorant Garamond",serif}
body{background:var(--white);color:var(--grey);font-family:var(--f-body);font-weight:300;font-size:18px;line-height:1.65}
.dark,.linen,.count,footer{background:var(--white);color:var(--grey)}
.band{padding-block:clamp(64px,8vw,112px)}
.band+.band{border-top:1px solid var(--hair)}
.wrap{max-width:1040px}
.label,.dark .label{color:var(--grey);font-family:var(--f-body);font-weight:400;font-size:12px;letter-spacing:.22em}
.sh{display:flex;flex-wrap:wrap;justify-content:center;gap:0 .32em;margin-bottom:clamp(32px,4.5vw,52px)}
.sh-script,.dark .sh-script,.sh-caps,.dark .sh-caps{font-family:var(--f-display);font-size:clamp(30px,4vw,44px);letter-spacing:.04em;padding:0;margin:0;transform:none;color:var(--ink2);text-transform:uppercase;line-height:1.2}
.flourish,.dark .flourish{color:var(--hair)}
a,.dark a{text-decoration-color:var(--hair)}
a:hover{text-decoration-color:var(--ink2)}
:focus-visible{outline-color:var(--ink2)}
/* nav */
.nav ul a{font-family:var(--f-body);font-weight:400;font-size:13px;letter-spacing:.16em}
.nav ul a.pill{border-color:currentColor}
.nav.solid{background:rgba(255,255,255,.97);box-shadow:0 1px 0 var(--hair)}
.nav.solid .mono,.nav.solid ul a,.nav.solid .menu-btn{color:var(--ink2)}
.nav.solid ul a:hover{color:var(--grey)}
.mono:hover{color:var(--cream)}
body::before{background:var(--white)}
@media (max-width:1000px){.nav ul{background:var(--white)}.nav ul a,.nav.open .menu-btn,.nav.open .mono{color:var(--ink2)}}
/* hero */
.hero::after{background:rgba(20,20,16,.32)}
.hero-kicker{font-family:var(--f-display);font-size:clamp(14px,1.5vw,18px);letter-spacing:.06em;text-transform:uppercase}
.hero-names{font-family:var(--f-display);font-size:clamp(34px,5.4vw,58px);letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;line-height:1.2;text-shadow:none}
.hero-date{font-family:var(--f-serif);font-size:clamp(20px,2.2vw,26px);letter-spacing:.04em;text-transform:none;padding:0}
.hero-place{font-family:var(--f-body);font-size:13px;letter-spacing:.2em}
.btn{font-family:var(--f-button);font-size:clamp(19px,1.8vw,23px);letter-spacing:.07em;text-transform:none;padding:14px 46px;border:1px solid currentColor}
.btn:hover{background:var(--ink2);color:var(--white);border-color:var(--ink2)}
.hero .btn:hover{background:var(--white);color:var(--ink2)}
.btn.solid,.dark .btn.solid{background:transparent;color:var(--ink2);border-color:var(--ink2)}
.btn.solid:hover,.dark .btn.solid:hover{background:var(--ink2);color:var(--white)}
/* countdown */
.count{padding-block:clamp(48px,6vw,80px);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.count-cap{font-family:var(--f-display);font-size:clamp(18px,2vw,22px);color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:18px}
.count-num{font-family:"Times New Roman",var(--f-serif),serif;color:var(--ink2);font-size:clamp(40px,5.2vw,60px)}
.count .label{font-family:"Times New Roman",var(--f-serif),serif;font-size:15px;letter-spacing:0;color:var(--ink2)}
/* story */
.story-text p:first-of-type::first-letter{all:unset}
.sign{font-family:var(--f-body);font-style:italic;font-weight:300;font-size:19px;color:var(--grey)}
.arch,.arch-frame,.event .photo{border-radius:0}
.arch-frame{border:0;padding:0}
/* weekend */
.timeline{border-top:1px solid var(--hair)}
.tl{border-bottom:1px solid var(--hair)}
.tl-when{color:var(--grey);font-family:var(--f-body);font-size:15px}
.tl-name{color:var(--ink2);font-size:clamp(20px,2.2vw,26px);letter-spacing:.06em}
.tl-where{color:var(--grey);font-family:var(--f-serif);font-size:20px}
.event-title{font-family:var(--f-display);font-size:clamp(24px,2.4vw,28px);color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.event dt{color:var(--ink2);font-weight:400}
.event dd{font-size:17px}
.event .tba{font-family:var(--f-display);color:var(--ink2)}
.wk-note{color:var(--grey);font-family:var(--f-serif);font-size:21px}
/* interlude */
.interlude::after{background:rgba(20,20,16,.3)}
.interlude-word{font-family:var(--f-display);font-size:clamp(48px,8vw,96px);letter-spacing:.24em;padding-left:.24em;text-transform:uppercase}
.interlude-line{font-family:var(--f-body);font-weight:400;font-size:13px;letter-spacing:.2em}
/* items */
.item h3{font-family:var(--f-display);font-size:21px;letter-spacing:.06em;color:var(--ink2)}
.item h3::after{background:var(--hair)}
.lede,.dark .lede{font-family:var(--f-serif);font-style:italic;font-size:clamp(22px,2.4vw,27px);color:var(--ink2)}
.hotel{background:var(--white);border:1px solid var(--hair)}
.hotel-name{font-family:var(--f-display);color:var(--ink2);font-size:24px;letter-spacing:.05em}
.hotel-town{font-family:var(--f-serif);font-size:20px;color:var(--grey)}
.dir{border-top:1px solid var(--hair)}
.dir-h{font-family:var(--f-display);font-size:clamp(20px,2.2vw,24px);color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.dir-cols h4{color:var(--ink2);font-weight:400}
/* towns */
.towns,.town{border-color:var(--hair)!important}
.town-name{font-family:var(--f-display);color:var(--ink2);font-size:clamp(24px,2.8vw,32px);letter-spacing:.05em}
.town-dist{color:var(--grey);font-family:var(--f-body);font-weight:400}
/* faq */
.qa h3{font-family:var(--f-serif);font-weight:500;font-size:23px;color:var(--ink2)}
/* registry */
.registry .big{font-family:var(--f-display);color:var(--ink2);font-size:clamp(26px,3.4vw,38px);letter-spacing:.02em}
/* rsvp */
.rsvp-head .big{font-family:var(--f-serif);font-size:clamp(26px,3vw,32px);color:var(--ink2);letter-spacing:0}
.field label,.field legend{color:var(--ink2);font-weight:400}
.hint{color:var(--grey);font-family:var(--f-body);font-size:14px}
input[type=text],input[type=email],textarea{color:var(--ink2);background:var(--white);border:0;border-bottom:1px solid #b9b7ad;font-weight:300}
input[type=text]:focus,input[type=email]:focus,textarea:focus{border-bottom-color:var(--ink2);outline:none}
input[type=radio]{accent-color:var(--ink2)}
.choices label{color:var(--grey)}
.form-msg{color:var(--ink2);font-family:var(--f-serif);font-size:20px}
/* footer */
footer{border-top:1px solid var(--hair)}
footer .fn{font-family:var(--f-display);font-size:clamp(24px,2.6vw,30px);letter-spacing:.24em;padding-left:.24em;color:var(--ink2);text-transform:uppercase}
footer .label{color:var(--grey)}
.ft-mono{color:var(--ink2)}
.linen{background:var(--ivory2)}
.band.linen+.band,.band+.band.linen{border-top:0}
.item h3::after{background:var(--candle)}
.flourish,.dark .flourish{color:var(--candle)}
.label,.dark .label,.event dt,.dir-cols h4{color:#8a7a6c}
.tl-when,.town-dist{color:#8a7a6c}
.story-text,.qa p,.item p{color:var(--grey)}
main .photo canvas{filter:grayscale(1) brightness(1.55) contrast(.8)}
main .hero .photo canvas{filter:none}
main .photo{background:#e9e8e3}

/* Invitation card: simple cream deckle-edge card with a notched double frame (no photo) */
.env-card{left:7%;right:7%;top:3%;width:auto;height:116%;display:block;padding:0;background:none;box-shadow:none;filter:drop-shadow(0 4px 10px rgba(40,30,20,.16))}
.env-card::before{content:none}
.card-paper{position:absolute;inset:0;width:100%;height:100%;display:block}
.card-txt{position:absolute;left:12%;right:12%;top:11%;display:grid;justify-items:center;gap:1.4cqw;text-align:center}

.env-post{top:4%!important;right:3.5%!important;width:46%!important;height:30%!important;color:inherit!important}

te the wedding of","env-names":"Ashley &amp; Eric","env-date":"Saturday, October 2, 2027","env-place":"Sa Pedrissa · Deià, Mallorca","env-open":"Open the Envelope","env-date2":"10. 02. 2027","env-place2":"Mallorca, Spain","card-names":"Ashley&amp;Eric","seal":"A&amp;E","hero-kicker":"Join us in spAIn\u003cbr>for the wedding of","hero-names":"Ashley &amp; Eric","hero-date":"October 2\u003csup>nd\u003c/sup>, 2027","hero-place":"Sa Pedrissa, Mallorca","hero-cta":"RSVP","cd-cap":"Until we say I do","cd-d":"Days","cd-h":"Hours","cd-m":"Minutes","cd-s":"Seconds","story-s":"Our","story-c":"Story","story-body":"\u003cp>Ashley and Eric fatefully were introduced back in the summer of 2022 at a rooftop club in New York City. Eric, not cool enough to normally be in that environment, bumped into Ashley, who certainly thought she was cool enough to be there (even though she snuck in). Ashley, a Texan, and Eric, a gringo from Connecticut, shared drinks, traded faux compliments about an insanely attractive bartender who Ashley claims “knew her,” and quickly found common ground over friendly banter and playful humor.\u003c/p>\u003cp>After surviving this chance encounter, the through-line of their relationship became laughter and a love for food. Whether that was reciting their favorite movie quotes or an impromptu chicken tender date night. Most importantly, they found an attraction to each other’s weird sense of humor, earnest honesty, competitive spirits and a shared value of family. They’ve endured training for and running a marathon, a year of Eric having to crash in Ashley and her roommate’s apartment, and four years of sharing a bed with Ashley’s stuffed bear, Fuzzy Wuzzy.\u003c/p>\u003cp>We are excited to take this next step in our lives together amongst our closest family and friends. Thank you for using up all your spare miles to travel to Mallorca to celebrate our love for one another.\u003c/p>","story-sign":"Love, \u003cbr>Ash &amp; Eric","wk-s":"The","wk-c":"Weekend","tl1-when":"Friday, October 1\u003csup>st\u003c/sup> · 6:30 PM","tl1-name":"Welcome Drinks","tl1-where":"Sa Pedrissa","tl2-when":"Saturday, October 2\u003csup>nd\u003c/sup> · 5:00 PM","tl2-name":"Wedding Day","tl2-where":"Sa Pedrissa","tl3-when":"Sunday, October 3\u003csup>rd\u003c/sup> · Time TBA","tl3-name":"The Day After","tl3-where":"To be announced","ev1-k":"Friday","ev1-title":"The Day Before","ev1-l1":"Date &amp; Time","ev1-v1":"October 1st, 2027\u003cbr>6:30 to 8:30 PM","ev1-l2":"Location","ev1-v2":"Sa Pedrissa\u003cbr>Ctra. Valldemossa–Deià, Km 64.5\u003cbr>07179 Deià, Mallorca","ev1-l3":"Dress Code","ev1-v3":"Cocktail Attire","ev2-k":"Saturday","ev2-title":"The Ceremony","ev2-l1":"Date &amp; Time","ev2-v1":"October 2nd, 2027\u003cbr>5:00 PM","ev2-l2":"Wedding Venue","ev2-v2":"Sa Pedrissa\u003cbr>Ctra. Valldemossa–Deià, Km 64.5\u003cbr>07179 Deià, Mallorca","ev2-l3":"Dress Code","ev2-v3":"Black Tie Required","ev3-k":"Sunday","ev3-title":"The Day After","ev3-tba":"TBA","ev3-v":"Stay tuned for details about our post-wedding event!","wk-tr":"Transportation to and from all events will be provided from our \u003ca href=\"#stay\">recommended hotels\u003c/a>.","wk-note":"Please return here closer to the date. We will have all key information easily accessible so you can enjoy your trip stress-free!","il-word":"Deià","il-line":"Between the Mediterranean Sea &amp; the Tramuntana mountains","tr-s":"Getting","tr-c":"Here","ts-h":"Travel &amp; Stay","tr-sub":"Getting There","st-sub":"Where to Stay","tr1-h":"Getting to Mallorca","tr1-b":"Palma de Mallorca Airport is the only commercial airport on the island. There are direct flights from NYC for guests traveling from there! \u003ca href=\"#map?pin=pmi\" class=\"map-pin-link\">See the airport on our map\u003c/a>","tr2-h":"Airport to Hotel","tr2-b":"While Uber now operates in Mallorca, it doesn’t service the airport. Instead, you’ll find a line of taxis right outside the arrivals area. Or skip the line with one of our \u003ca href=\"#transport\">transportation options\u003c/a>.","tr3-h":"Deià &amp; The Drive","tr3-b":"The hotels near our venue are in Deià, a charming cliffside mountain village that is also a bit of a drive from the airport (about 40 minutes). We’ve listed \u003ca href=\"#transport\">resources for the best travel options\u003c/a>, but if you need help coordinating a ride, please reach out!","tr4-h":"Getting Around","tr4-b":"Mallorca is easy to get around (you can drive across the island in about 90 minutes), so no matter where you stay, you’re never too far from anything!","tr5-h":"Enjoy the Island!","tr5-b":"If you arrive earlier in the week, we’ve included recommendations of \u003ca href=\"#stay\">places to stay\u003c/a> and \u003ca href=\"#explore\">areas to visit\u003c/a>.","st-s":"Where to","st-c":"Stay","st-intro":"Between the Mediterranean Sea &amp; the Tramuntana mountains you’ll find the relaxing coastal village of Deià. Here’s everything you need to get there and settle in.","st-lead":"Deià is a small village with only a handful of hotels, so we’ve picked our two favorites for you: one tucked right into Deià, and one a short, scenic drive away in Valldemossa. Both are close to our wedding venue, and both are the kind of place you won’t want to leave.","h1-name":"Hotel Es Molí","h1-town":"Deià","h1-link":"\u003ca href=\"https://www.esmoli.com\" target=\"_blank\" rel=\"noopener\">Visit the hotel\u003c/a>","h2-name":"Hotel Bordoy Continental","h2-town":"Valldemossa","h2-link":"\u003ca href=\"https://www.bordoyhotels.com/en/hotel-continental-valldemossa/hotel\" target=\"_blank\" rel=\"noopener\">Visit the hotel\u003c/a>","st-notes":"\u003cp>Unfortunately, Deià does not have hotels that offer room blocks in the area. Please book directly through the links above.\u003c/p>\u003cp>Good to know: many hotels in the area are adults-only, so keep that in mind if you’re booking somewhere other than the two hotels above.\u003c/p>\u003cp>We will have shuttle services running to Sa Pedrissa for our reception from the two hotels above. If you choose to stay somewhere else, we highly recommend renting a car or scheduling a driver. \u003c/p>\u003cp>Please note, on the day of the wedding \u003cb>no\u003c/b> parking spaces will be allotted to guests.\u003c/p>","go-s":"\u003cbr>","go-c":"Transportation","go-intro":"You already flew 3,500 miles. We got you now!","go1-h":"Reception","go1-b":"We will be offering transportation on the wedding day for guests who stay at our two \u003ca href=\"#stay\">recommended hotels\u003c/a>. Stay tuned for shuttle timing as we approach closer to our special day!","go2-h":"Welcome Drinks","go2-b":"If you plan on attending Welcome Drinks at Sa Pedrissa, we will have transportation available to bring you to and from the venue from both hotels.","go3-h":"Solo Mission","go3-b":"If you like charting your own course, you can rent a car and enjoy the scenic views of Deià or book a private driver. We’ve included some companies below. \u003cem>Sa Pedrissa has very limited parking spots, so plan on taking the provided transportation to the venue.\u003c/em>","go4-h":"Good to Know","go4-b":"The roads to Deià are narrow and winding, so for anything outside the shuttle schedule we’d recommend a taxi or car service rather than driving yourself after dark.","dir-h":"Transportation services for your time in Mallorca","dir1-h":"Ride Apps &amp; Taxis","dir1-b":"\u003cul>\u003cli>\u003ca href=\"https://www.uber.com\" target=\"_blank\" rel=\"noopener\">Uber\u003c/a>\u003cem>Available around the island (not at the airport)\u003c/em>\u003c/li>\u003cli>\u003ca href=\"https://apps.apple.com/app/id6470745765\" target=\"_blank\" rel=\"noopener\">Mallorcab\u003c/a>\u003cem>The island’s taxi app\u003c/em>\u003c/li>\u003cli>Street taxis\u003cem>Easy to hail anywhere central\u003c/em>\u003c/li>\u003c/ul>","dir2-h":"Car Rental","dir2-b":"\u003cul>\u003cli>\u003ca href=\"https://www.clickrent.es\" target=\"_blank\" rel=\"noopener\">ClickRent\u003c/a>\u003cem>Local car rental\u003c/em>\u003c/li>\u003cli>\u003ca href=\"https://www.sixt.com/ride/mallorca\" target=\"_blank\" rel=\"noopener\">Sixt\u003c/a>\u003cem>Car rental, plus drivers on request\u003c/em>\u003c/li>\u003c/ul>","dir3-h":"Schedule a Driver","dir3-b":"\u003cul>\u003cli>\u003ca href=\"#\">Drivers in Motion\u003c/a>\u003cem>Private transfers\u003c/em>\u003c/li>\u003cli>\u003ca href=\"https://www.transfeero.com/en/city/palma-de-mallorca/\" target=\"_blank\" rel=\"noopener\">Transfeero\u003c/a>\u003cem>Book a car and driver online\u003c/em>\u003c/li>\u003c/ul>","ex-s":"Towns to","ex-c":"Explore","ex-intro":"Mallorca has so much more to offer beyond our wedding weekend. Here are a few of our favorite spots to check out while you’re here.","tw1-n":"Palma","tw1-d":"Airport located here","tw1-b":"The airport is in Palma, but it’s also home to Mallorca’s main city. If you can spare a day, plan to stay here before or after the wedding. Get lost in the alleys of Palma’s Old Town, pop into the cathedral (La Seu), or people-watch with a glass of wine and a plate of croquetas at one of the many cafés around the city.","tw2-n":"Sóller","tw2-d":"35–40 min from the airport","tw2-b":"Ride the old train up into an orange-grove valley that feels miles from everywhere. Sóller offers a more relaxed, scenic vibe with beautiful views and a slower pace. If you plan to stay in Sóller or explore nearby areas, we suggest renting a car or booking a driver for convenience.","tw3-n":"Port de Sóller","tw3-d":"40–45 min from the airport","tw3-b":"Take the vintage train the rest of the way down to the water. The water is as still as it is blue, making it the right atmosphere for both a quick swim and a sunset drink.","tw4-n":"Valldemossa","tw4-d":"25–30 min from the airport","tw4-b":"A rustic village that’s perfect for a pit stop on the way to Sa Pedrissa. The cobblestone streets are lined with flower-covered buildings that feel straight out of a movie.","tw5-n":"Deià","tw5-d":"40 min from the airport","tw5-b":"And this is where it all happens. A cliffside village of terracotta roofs and picturesque views. Swim at Cala Deià or hike the cliffs above it, and you’ll see why we picked this spot!","faq-s":"\u003cbr>","faq-c":"FAQ's","q1":"What airport should we fly into?","a1":"Fly into Palma de Mallorca Airport (PMI), about a 40-minute drive from Deià.","q2":"Can I bring a plus-one?","a2":"Due to limited space, we’re only able to host the guests named on your invitation.","q3":"Are children invited?","a3":"We love your little ones, but we kindly ask that our wedding weekend be a celebration just for the adults. All events planned will be 18+ so everyone can relax, let loose, and enjoy the weekend with us. Thank you for understanding!","q4":"Is transportation included for the wedding weekend?","a4":"Yes! We’ll provide shuttle service between our recommended hotels and Sa Pedrissa for all wedding festivities. Shuttle times will be shared closer to the date. The roads to Deià are narrow and winding, so we’d recommend getting a taxi or car service to your hotel in Deià.","q5":"What is the dress code for the wedding?","a5":"We’re going all out, and we’d love for you to join us! Black tie is required: tuxedos for the gentlemen and floor-length formal gowns for the ladies.","q6":"What is the dress code for the welcome party?","a6":"Cocktail attire, please. Come ready to toast the start of a beautiful weekend in Mallorca!","q7":"What will the weather be like?","a7":"Early October in Mallorca is typically warm and sunny, with highs in the mid-70s to low 80s °F and cooler evenings around 60°F. We recommend bringing a light layer for the evenings.","q9":"What travel documents will I need?","a9":"You’ll need a valid passport. Spain requires that it was issued within the last 10 years and is valid for at least 3 months after the day you leave Europe, but we recommend having at least 6 months left on it to be safe. The EU is also planning a new online travel authorization for visitors (called ETIAS), and we’ll update this page if it’s required before the wedding.","q8":"Where can I find the full weekend schedule?","a8":"Right \u003ca href=\"#weekend\">here on the website\u003c/a>. We’ll add every detail closer to the date.","rg-s":"Wedding","rg-c":"Registry","rg-big":"Your presence is our gift.","rg-body":"However, if you still wish to give us a wedding gift, we would be grateful for a contribution towards our honeymoon or our future home.","rg-link":"\u003ca href=\"https://www.honeyfund.com/site/castellanos-hawes-10-02-2027\" target=\"_blank\" rel=\"noopener\" class=\"btn solid\">Contribute here\u003c/a>","rs-s":"Kindly","rs-c":"Reply","rs-big":"We can’t wait to see you there!","rs-by":"Please RSVP by March 31st, 2027.","rs-q1":"Who’s attending?","rs-h1":"Add the first and last name of each person in your party.","rs-q2":"Email address","rs-h2":"One email address per couple is sufficient.","rs-q3":"Will you be attending the welcome drinks on October 1st?","rs-q4":"Will you be attending the wedding on October 2nd?","rs-q5":"Will you be attending the post-wedding event on October 3rd?","rs-q6":"Do you have any food allergies, intolerances, dietary requirements or religious dietary restrictions?","rs-yes":"Yes, can't wait!","rs-no":"Regretfully decline","rs-submit":"Send RSVP","rs-thanks":"Thank you! Your RSVP has been received. We can’t wait to celebrate with you!","ft-names":"Ashley &amp; Eric","fw-k":"¡Nos Vemos en Mallorca!","fw-n":"Ashley &amp; Eric","ft-top":"\u003ca href=\"#top\">Back to top\u003c/a>","ft-line":"October 2\u003csup>nd\u003c/sup>, 2027 · Sa Pedrissa · Deià, Mallorca","nav-spots":"Recommendations","fs-s":"Our Favorite","fs-c":"Spots","fs-intro":"Mallorca is a special place to us and we suspect many of you will feel the same after leaving. After just 72 hours we knew the island had a special character that each of you would fall in love with. We wanted to share some of our favorites that brought us closer to Mallorca. Tap any spot to find it on the map below.","fs-c1":"Restaurants","fs-c2":"Bars","fs-c3":"Places to Visit","fs-empty1":"More of our favorites coming soon.","fs-empty2":"More of our favorites coming soon.","fs-empty3":"More of our favorites coming soon.","sp-cappuccino-n":"Hotel Cappuccino","sp-cappuccino-t":"Palma · Old Town","sp-cappuccino-b":"Right in the heart of the Old Town. Stop at the Grand Café for a coffee or perhaps something a bit stronger. We often started our mornings here or snuck over for a pre dinner glass of wine and some people watching.","sp-seu-n":"La Seu Cathedral","sp-seu-t":"Palma · Old Town","sp-seu-b":"Palma’s famous Gothic cathedral, sitting right above the water. Go inside on a sunny morning when light pours through the stained glass, then stroll the old city walls beside it.","sp-larosa-n":"Vermutería La Rosa","sp-larosa-t":"Palma · Old Town","sp-larosa-b":"We loved this place for its local charm. A cozy tapas bar tucked down a side street in Palma. The croquettes were so good, that we ordered them twice.","sp-patro-n":"Ca’s Patró March","sp-patro-t":"Cala Deià","sp-patro-b":"A little seafood spot perched on the rocks above Cala Deià, with turquoise water right below you (you might recognize it from \u003cem>The Night Manager or all over Tik-Tok)\u003c/em>","sp-olivo-n":"El Olivo at Belmond La Residencia","sp-olivo-t":"Deià","sp-olivo-b":"The restaurant at Belmond La Residencia, sits inside a 17th-century olive mill with the original press. A favorite part of ours was sneaking away to check out some of the local art that they hang on the walls.","sp-ghost-n":"Mysterious Palma Ghost Tour","sp-ghost-t":"Palma · Old Town, after dark","sp-ghost-b":"A two-hour walk through Palma’s haunted houses and ghost stories, starting at sunset. Fun fact: Ashley’s mom once snuck onto this tour. Sneaking in clearly runs in the family (see Our Story). We’d recommend actually booking a spot, though the ghosts didn’t seem to mind.","fs-c4":"Beaches","fs-empty4":"More of our favorites coming soon.","sp-caladeia-n":"Cala Deià","sp-caladeia-t":"Deià","sp-caladeia-b":"A little rocky cove at the bottom of the valley below Deià, with clear turquoise water that’s perfect for a swim. It’s pebbly rather than sandy, so bring water shoes, and stay for lunch on the rocks at Ca’s Patró March.","sp-formentor-n":"Cala Formentor","sp-formentor-t":"Formentor Peninsula · North","sp-formentor-b":"A pine-lined beach on the Formentor peninsula with calm, crystal-clear water. The cliffside drive out is half the fun, so pull over at the Mirador des Colomer lookout on the way. Go early in summer, as parking fills up fast.","sp-estrenc-n":"Es Trenc","sp-estrenc-t":"South Coast · Campos","sp-estrenc-b":"Mallorca’s famous stretch of soft white sand and shallow, Caribbean-blue water, backed by dunes with no big hotels in sight. It goes on long enough that you can always find your own spot.","sp-llombards-n":"Cala Llombards","sp-llombards-t":"Southeast Coast · Santanyí","sp-llombards-b":"A small sandy cove tucked between rocky cliffs, with clear, calm water and a laid-back beach bar. A quieter local favorite and a great stop if you’re exploring the southeast.","train-n":"The Sóller Train","train-s":"A vintage wooden train that has run from Palma to Sóller since 1912, winding through the mountains and 13 tunnels (about 1 hr). From Sóller, hop on the old tram down to Port de Sóller (about 15 min).","env-inv":"You’re Invited","env-to":"to the wedding of","card-cap":"Ashley &amp; Eric","card-n1":"Ashley","card-n2":"Eric","env-n1":"Ashley","env-n2":"Eric","pc-greet":"Greetings from Mallorca","pl1-c":"La Rosa","pl2-c":"Ca’s Patró March","pl3-c":"Cala Deià","xb-xtransport":"Transportation will be provided to and from all events."},"st":{"story-sign":{"a":"center"},"rs-yes":{"w":160},"fs-intro":{"w":790},"env-n2":{"w":160},"st-notes":{"s":1.1}},"spots":[{"id":"cappuccino","cat":2,"area":"palma","lat":39.57,"lng":2.6503,"q":"Hotel Cappuccino, Plaça de Cort, Palma"},{"id":"seu","cat":3,"area":"palma","lat":39.5675,"lng":2.6484,"q":"Catedral de Mallorca La Seu, Palma"},{"id":"larosa","cat":1,"area":"palma","lat":39.5719,"lng":2.6476,"side":"l","q":"La Rosa Vermutería, Carrer de la Rosa 5, Palma"},{"id":"patro","cat":1,"area":"deia","lat":39.7672,"lng":2.6352,"q":"Ca's Patró March, Cala Deià, Mallorca"},{"id":"olivo","cat":1,"area":"deia","lat":39.7465,"lng":2.6436,"side":"l","q":"El Olivo, Belmond La Residencia, Deià"},{"id":"ghost","cat":3,"area":"palma","lat":39.5697,"lng":2.6455,"side":"r","q":"Carrer de Sant Feliu 1, Palma","url":"https://rutasmisteriosas.es/reservar/palma-tenebrosa-en/","ul":"Book the tour"},{"id":"caladeia","cat":4,"area":"deia","lat":39.7656,"lng":2.6368,"side":"l","q":"Cala Deià, Mallorca"},{"id":"formentor","cat":4,"area":"island","lat":39.9295,"lng":3.1355,"side":"l","q":"Platja de Formentor, Mallorca"},{"id":"estrenc","cat":4,"area":"island","lat":39.3486,"lng":2.9887,"side":"l","q":"Platja des Trenc, Mallorca"},{"id":"llombards","cat":4,"area":"island","lat":39.3297,"lng":3.1458,"side":"r","q":"Cala Llombards, Santanyí, Mallorca"}],"xb":{"weekend":[]}}</script>

  function selectSlot(fig){ if (selected) selected.classList.remove("slot-selected"); selected = fig; if (fig){ fig.classList.add("slot-selected"); setStatus("Picture selected. Paste a photo with Cmd+V (Mac) or Ctrl+V (Windows)."); } }
  document.addEventListener("mousemove", function(e){ hovered = slotFor(e.target); }, {passive:true});
  document.addEventListener("click", function(e){
    if (!editing || e.target.closest("[data-k],button,a,.edit-bar,.fmtbar,.linkbar,input,textarea,label")) return;
    var fig = slotFor(e.target); if (fig) selectSlot(fig);
  });
  document.addEventListener("paste", function(e){
    var cd = e.clipboardData; if (!cd) return;
    var file = null, i;
    if (cd.files && cd.files.length){ for (i = 0; i < cd.files.length; i++) if (/^(image|video)\//.test(cd.files[i].type)){ file = cd.files[i]; break; } }
    if (!file && cd.items){ for (i = 0; i < cd.items.length; i++){ var it = cd.items[i]; if (it.kind === "file" && /^image\//.test(it.type)){ file = it.getAsFile(); break; } } }
    if (!file) return;
    e.preventDefault(); e.stopImmediatePropagation();
    var target = selected || hovered;
    if (!editing) enterEdit();
    if (!target){ setStatus("Click the picture you want to replace, then paste again."); return; }
    uploadTo(target.dataset.photo, file); selectSlot(null);
  }, true);
  document.addEventListener("dragleave", function(e){ if (!e.relatedTarget) clear(); });
  document.addEventListener("drop", function(e){
    if (!hasFiles(e)) return; e.preventDefault();
    var fig = slotFor(e.target); clear();
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (fig && f) uploadTo(fig.dataset.photo, f);
  });
}
function save(){
  collect(); hideBars(); saveBtn.disabled = true; setStatus("Publishing…");
  try { sessionStorage.setItem("ae-opened","1"); } catch(e) {}
  artifactNS.publish(documentHTML()).then(function(){ dirty = false; setStatus("Saved and published"); })
  .catch(function(err){ var c = err && err.code;
    if (c === "conflict"){ dirty = false; setStatus("Someone else saved a newer version. Reloading it now."); }
    else if (c === "not_writer" || c === "not_granted"){ setStatus("This view is read-only, so changes can’t be saved here."); }
    else { saveBtn.disabled = false; setStatus("Couldn’t publish just now. Your edits are still here, so try Save again."); } });
}
(function initEditing(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  window.claude.use("artifact").then(function(a){ if (!a) return; artifactNS = a;
    return window.claude.use("user").then(function(u){ return u ? u.canEdit() : false; }).then(function(can){
      if (!can) return;
      window.claude.use("assets").then(function(x){ assetsNS = x; });
      buildEditUI(); wireDrop();
      if (location.hash === "#envelope"){ enterEdit(); var ib = document.getElementById("intro"); ib.hidden = false; ib.classList.add("peek"); document.documentElement.classList.add("locked"); var eb = document.getElementById("ed-env"); if (eb){ eb.textContent = "Show envelope"; eb.click(); } ib.classList.add("peek"); setStatus("Envelope opened. Drag or paste a photo onto the card. Click the envelope to close it."); }
    });
  }).catch(function(){});
})();
})();
